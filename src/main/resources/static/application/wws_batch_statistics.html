<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
.skillbar .title{
	font-size: 13px;
    font-weight:bold;
}
input.noborder{
	border:0;
	background-color:#fff;
	width: 90%;
	padding-left:5px;
	border-radius: 5px;
	
}
input.noborder.ffper{
	width: 10%;
}
span.showBlock{
	display:block;
	border-bottom: 1px dashed #D5D5D5;
	line-height:26px;
	width: 100%;
}
span.taskState{
	font-size:12px;
	font-family:'微软雅黑';
	display: inline-block;
    width: 110px;
    text-align: right;
}
.panel-title {
    margin-top: 0;
    margin-bottom: 0;
    font-size: 14px;
    font-weight:bold;
    color: black;
}
</style>
<script src="js/echarts-all.js"></script>
<script type="text/javascript" src="js/jquery.pagination.js"></script>
<ol class="breadcrumb page-breadcrumb">
	<li class="breadcrumb-item"><a href="javascript:void(0);">分布式调度</a></li>
	<li class="breadcrumb-item">任务批量</li>
	<li class="breadcrumb-item active">批量进度</li>
	<li class="position-absolute pos-top pos-right d-none d-sm-block"><span class="js-get-date"></span></li>
</ol>
<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 py-2">
			<form class="form-inline" onsubmit="return false;">
				<div class="form-group input-group-sm mr-2 my-1">
					<label >产品名称:</label>
					<select id="collapse_productsQ" class="form-control" name="collapse_productsQ" ></select>
				</div>
				<div class="form-group input-group-sm mr-2 my-1">
					<label >批量:</label>
					<input type="text" id="collapse_batchNo" class="form-control">
				</div>
				<div class="form-group mr-1 my-1">
					<button type="button" id="btn_redis_batchStaticQuery" class="btn btn-sm btn-primary mr-1">
						<i class="fal fa-binoculars fa-fw" aria-hidden="true"></i>查询
					</button>
					<button type="button" id="btn_redis_clear" class="btn btn-sm btn-primary">
						<i class="fal fa-registered fa-fw"></i>重置
					</button>
					<span class="mx-3 text-danger">(请选择产品后查询)</span>
				</div>
			</form>
		</div>
	</div>
</div>

<div class="container-fluid p-0 mt-2" id="batchs_skill">
	<!-- ko if: batchs().length == 0 -->
	<div class='panel mb-2'>
		<div class="panel-container">
		<div class="panel-content px-3 py-2">
			<div class="skillbar angular" style="margin:0;padding:0;">
				<div class="filled" data-width="100%" style="width:100%;">
					<span class="title" style="width:20%;">No Batch Informations</span>
				</div>
			</div>
		</div>
		</div>
	</div>
	<!-- /ko -->
	<!-- ko if: batchs().length > 0 -->
	<div id="batchs_pagination" style="padding-left:10px;margin-bottom:15px"></div>
	
	<div class='card' style="border:0;margin-bottom:10px;border-radius:5px;">
		<div class='card-header' style="margin:0;padding:0;border:0;">
			<div class="skillbar" style="margin:0;padding:0;height:35px;">
				<span class="pl-4 title" style="height:35px;min-width:200px;font-color:white;text-align:left;background-color: #fff;vertical-align:middle;" >
					<input type="checkbox" class="_selectAllBatch" style="vertical-align:middle;"/>
					<span style="color:black;vertical-align:middle;" class="ml-1">全选</span>
					<button class="btn btn-primary btn-xs ml-2" type="button" id="btn_batch_del">
			        	<i class="fal fa-bomb fa-fw mr-1"></i>删除
			    	</button>
				</span>
			</div>
		</div>
    </div>
	<!-- ko foreach: batchs -->
	<div class='card' style="border:0;margin-bottom: 10px;border-radius:5px;">
		<table>
			<tr>
				<td>
					<div class='card-header' style="margin:0;padding:0;border:0;">
						<div data-bind="attr:{'class':'skillbar ' + $parent.skillcsss[code]}" style="margin:0;padding:0;">
							<div class="filled" data-bind="attr:{'data-width':finishedPercent}"></div>
							<span class="title pl-4" style="width:20%;font-color:white;text-align:left;">
								<input type="checkbox" class="_cbox_single_batch" style="vertical-align:middle;"/>
								<input type="hidden" data-bind="attr:{'value':product}" name="product"/>
								<input type="hidden" data-bind="attr:{'value':batch}" name="batch"/>
								<a data-toggle='collapse' data-bind="attr:{'href':'#collapse_panel_batch_'+$index(),'id':'a_batch_'+$index()},click: $parent.refreshBatch">
									<span style="color:white;"><!--ko text: batch--><!--/ko--></span>
								</a>
							</span>
							<span class="percent">
								(<!--ko text: product--><!--/ko-->)<!--ko text: finishedPercent--><!--/ko-->
							</span>
						</div>
					</div>
				</td>
			</tr>
		</table>
		
		<div data-bind="attr:{'id':'collapse_panel_batch_'+$index()}" class='collapse' data-parent='#batchs_skill'>
			<div class='card-body'>
				<table class="table table-striped table-sm table-bordered mb-0 table-condensed">
					<tbody>
						<tr>
							<td style="text-align:right;width:160px"><label >产品：</label></td>
							<td style="text-align:left" data-bind="text:product"></td>
						</tr>
						<tr>
							<td style="text-align:right;width:160px"><label >任务总数：</label></td>
							<td style="text-align:left">
								<!-- ko if: $data.jobInsIds.length > 0 -->
									<!-- ko foreach: jobInsIds -->
										<span data-bind="text:$data" class="badge badge-danger"></span>
									<!-- /ko -->
								<!-- /ko -->
								<span data-bind="text:jobInsTotal" class="badge badge-info"></span>
							</td>
						</tr>
						<tr>
							<td style="text-align:right;"><label >运行时间：</label></td>
							<td style="text-align:left" data-bind="text:spentTime"></td>
						</tr>
						<tr>
							<td style="text-align:right;"><label >任务项总数：</label></td>
							<td style="text-align:left" data-bind="text:taskInsTotal"></td>
						</tr>
						<tr>
							<td style="text-align:right;"><label >任务状态：</label></td>
							<td style="text-align:left" data-bind="text:stateDesc"></td>
						</tr>
						<tr>
							<td style="text-align:right;"><label >任务项状态：</label></td>
							<td style="text-align:left">
								<div class='col-md-11' style="margin-bottom:5px">
								<div class='input-group'>
									<span class='showBlock'>
										<span class='taskState'>执行成功:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskSuccessTotal}" type='text' class='noborder ffper' readonly='readonly'>
										<span class='taskState'>执行失败:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskFailedTotal}" type='text' class='noborder ffper' readonly='readonly'>
										<span class='taskState'>正在执行:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskRunningTotal}" type='text' class='noborder ffper' readonly='readonly'>
									</span>
									<span class='showBlock'>
										<span class='taskState'>初始状态:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskInitTotal}" type='text' class='noborder ffper' readonly='readonly'>
										<span class='taskState'>结果返回:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskFeedbackTotal}" type='text' class='noborder ffper' readonly='readonly'>
										<span class='taskState'>出错延迟:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskErrorDelayTotal}" type='text' class='noborder ffper' readonly='readonly'>
									</span>
									<span class='showBlock'>
										<span class='taskState'>等待执行:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskReadyTotal}" type='text' class='noborder ffper' readonly='readonly'>
										<span class='taskState'>窗口延迟:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskCycleDelayTotal}" type='text' class='noborder ffper' readonly='readonly'>
										<span class='taskState'>待人干预:</span>
										<input style='margin-left:5px;' data-bind="attr:{'value':$data.taskMaualTotal}" type='text' class='noborder ffper' readonly='readonly'>
									</span> 
								</div>
								</div>
							</td>
						</tr>
						<tr>
							<td style="text-align:right;"><label >操作：</label></td>
							<td style="text-align:left">
								<button type="button" class="btn btn-sm btn-warning" data-bind="click:$parent.clearBatch">
									<i class="fal fa-bomb fa-fw" aria-hidden="true"></i>
									清空批量数据 <span style="color:#000;font-weight:bold" data-bind="text:batch"></span>
								</button>
								<button type="button" class="btn btn-sm btn-info" data-bind="attr:{'id':'button_refresh_'+$index()},click:$parent.refreshBatch">
									<i class="fal fa-sync fa-fw" aria-hidden="true"></i>刷新
								</button>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<!-- /ko -->
	<!-- /ko -->
</div>
