<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 pt-0 pb-2">
			<div id="full_screen_div">
				<div class="mt-2">
					<button type="button" class="btn btn-sm btn-success" id="btn_save_graphy" title="保存">
						<i class="fal fa-save fa-fw"></i>
					</button>
					<div class="btn-group">
						<button type="button" class="btn btn-sm btn-info" id="btn_format_graphy" title="层排序">
							<i class="fal fa-share-alt fa-fw"></i>
						</button>
						<button type="button" class="btn btn-sm btn-info" id="btn_layout_vertical" title="水平排序" >
							<i class="fal fa-random fa-fw"></i>
						</button>
						<button type="button" class="btn btn-sm btn-info" id="btn_layout_horizontal" title="垂直排序" >
							<i class="fal fa-sitemap fa-fw"></i>
						</button>
					</div>
					<button type="button" class="btn btn-sm btn-success" id="btn_full_screen_graphy" title="页面缩放" >
						<i class="fal fa-arrows-alt fa-fw"></i>
					</button>
					<button type="button" class="btn btn-sm btn-success" id="btn_job_edit" title="编辑任务信息" >
						<i class="fal fa-edit fa-fw"></i>
					</button>
					<button type="button" class="btn btn-sm btn-success" id="btn_job_running" title="启动任务实例" >
						<i class="fal fa-play fa-fw"></i>
					</button>
				</div>
				<div class="jtk-page-container mt-2">
		            <div class="jtk-container">
			            <div class="jtk-demo-main" id="jtk-demo-dbase">
							<div id="jtk-demo-dbase1" style="display:flex;">
								<div class="sidebar node-palette" style="margin-right:2px;padding-top:0">
									<div class="panel-group" id="jtpl-acpg"  role="tablist" aria-multiselectable="true">
									
									</div>
					            </div>
								<div class="jtk-demo-canvas">
									<div class="controls">
						                <i class="fal fa-arrows selected-mode" mode="pan" title="Pan Mode"></i>
						                <i class="fal fa-pencil" mode="select" title="Select Mode"></i>
						                <i class="fal fa-home" reset title="Zoom To Fit"></i>
						            </div>
						            <div class="miniview"></div>
						        </div>
						    </div>
						     <div class="jtk-demo-dataset"></div>
					    </div>
					</div>
				 </div>
			</div>
		</div>
	</div>
</div>
