<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<ol class="breadcrumb page-breadcrumb">
    <li class="breadcrumb-item"><a href="javascript:void(0);">分布式调度</a></li>
    <li class="breadcrumb-item">任务管理</li>
    <li class="breadcrumb-item active">任务维度</li>
    <li class="position-absolute pos-top pos-right d-none d-sm-block"><span class="js-get-date"></span></li>
</ol>
<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 py-2">
			<form class="form-inline" onsubmit="return false;">
				<div class="form-group mr-1 my-1">
					<label>产品：</label> 
					<select id="query_product" class="form-control-sm" name="product" ></select>
				</div>
				<div class="form-group mr-1 my-1">
					<label>维度：</label>
					<input type="text" name="dimension" class="form-control-sm">
				</div>
				<div class="form-group mr-1 my-1">
					<button type="button" id="btn_dmsn_query" class="btn btn-sm btn-primary mr-1">
						<i class="fal fa-binoculars fa-fw"></i>查询
					</button>
					<button type="button" id="btn_dmsn_clear" class="btn btn-sm btn-primary">
						<i class="fal fa-registered fa-fw" aria-hidden="true"></i>重置
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
<div id="tab_dimension_toolbar" class="btn-group">
	<button type="button" id="btn_dmsn_add"  class="btn btn-primary btn-sm">
		<i class="fal fa-plus-square fa-fw"></i>新增
	</button>
	<button type="button" id="btn_dmsn_remove" class="btn btn-primary btn-sm">
		<i class="fal fa-minus-square fa-fw"></i>删除
	</button>
</div>
<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 pt-0 pb-2">
			<table data-toggle="table" class="table table-sm table-striped" id="tb_dimension"></table>
		</div>
	</div>
</div>

<div class="modal fade in" id="dmsnModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header py-2">
				维度实体管理
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
			</div>
			<div class="modal-body px-3 py-0">
				<form id="entity_query_form" class="form-inline">
					<table class="table table-sm table-striped table-bordered table-condensed table-form mb-1">
						<tr>
							<td style="width:15%;"><span>产品：</span></td>
							<td style="height:32px;width:35%;"><span style="float:left;" name="e_product"></span></td>
							<td style="width:15%;"><span>维度：</span></td>
							<td style="height:32px;width:35%;"><span style="float:left;" name="e_dimension"></span></td>
						</tr>
						<tr>
							<td><span>维度实体：</span></td>
							<td>
								<input name="input_entity" id="input_entity" class="form-control-sm" placeholder="请输入维度实体名" style="width:80%">
								<input type="text" name="preventSubmitForm-ie" style="display:none;">
							</td>
							<td><span>标签：</span></td>
							<td>
								<select name="input_tag" id = "input_tag" class="form-control-sm" style="width:80%"> 
									<option value="" selected="selected">Please choose tag</option>
								</select>
							</td>
						</tr>
						<tr>
						    <td style="text-align:center" colspan="4" >
						    	<button type="button" id="btn_entities_query" class="btn btn-sm btn-primary">
									<i class="fal fa-binoculars" aria-hidden="true"></i>查询
								</button>
								<button type="button" id="btn_entities_clear" class="btn btn-sm btn-primary">
									<i class="fal fa-registered fa-fw" aria-hidden="true"></i>重置
								</button>
						    </td>
						</tr>
					</table>
				</form>
				<div id="tb_dmsn_entities_bar" class="btn-group">
					<button id="tb_dmsn_entities_add" type="button"
						class="btn btn-default btn-sm">
						<i class="fal fa-plus-square"></i> 新增
					</button>
					<button id="tb_dmsn_entities_del" type="button"
						class="btn btn-default btn-sm">
						<i class="fal fa-minus-square"></i> 删除
					</button>
					<button id="tb_dmsn_entities_tags_add" type="button"
						class="btn btn-default btn-sm">
						<i class="fal fa-plus-square"></i> 批量新增标签
					</button>
					<button id="tb_dmsn_entities_tags_del" type="button"
						class="btn btn-default btn-sm">
						<i class="fal fa-minus-square"></i> 批量删除标签
					</button>
				</div>
				<table id="tb_dmsn_entities" class="table table-sm table-striped"></table>
			</div>
		</div>
	</div>
</div>
<div class="modal fade in" id="dmsnAddModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header py-2">
				新增维度
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
			</div>
			<div class="modal-body px-3 py-0 mb-2">
				<div id="tb_dmsn_add_bar" class="btn-group mb-2">
					<button id="btn_entity_add" type="button" class="btn btn-default btn-sm">
						<i class="fal fa-plus-square"></i> 新增维度实体
					</button>
					<button id="btn_dmsn_save" type="button" class="btn btn-default btn-sm">
						<i class="fal fa-save" aria-hidden="true"></i> 保存
					</button>
				</div>
				<table id="tb_dmsn_add" class="table table-sm table-striped mb-2"></table>
			</div>
		</div>
	</div>
</div>

<div class="modal fade in" id="entityAddModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header py-2" >
				新增维度实体
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
			</div>
			<div class="modal-body px-3 pt-1 pb-2">
				<form id="entity_add_form" class="form-inline">
					<table
						class="table table-sm table-striped table-bordered table-condensed table-form mb-0">
						<tr>
							<td style="width:15%;"><span>产品：</span></td>
							<td style="height:32px;width:35%;"><span style="float:left;" name="ea_product"></span></td>
							<td style="width:15%;"><span>维度：</span></td>
							<td style="height:32px;width:35%;"><span style="float:left;" name="ea_dimension"></span></td>
						</tr>
					</table>
				</form>
				<div id="tb_dmsn_entity_add_bar" class="btn-group my-1" style="float:right;">
					<button id="btn_entity_save" type="button" class="btn btn-primary btn-sm"><i class="fal fa-save fa-fw"></i>保存</button>
				</div>
				<table id="tb_entity_add" class="table table-sm table-striped pb-2"></table>
			</div>
		</div>
	</div>
</div>
<div class="modal fade in" id="tagAddModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabelTag" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header py-2">
				<label name="tagsTitle"></label>
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
			</div>
			<div class="modal-body px-3 py-0">
				<form class="form-inline">
				    <input type="hidden" name="type">
					<table class="table table-sm table-striped table-bordered table-condensed table-form mb-1">
						<tbody>
							<tr>
								<td style="width:20%;"><span>产品:</span></td>
								<td><input type="text" name="product" class="form-control-sm" style="width:90%;"></td>
							</tr>
							<tr>
								<td style="width:20%;"><span>维度:</span></td>
							    <td><input type="text" name="dimension" class="form-control-sm" style="width:90%;"></td>
						    </tr>
							<tr>
								<td style="width:20%;"><span>维度实体:</span></td>
							    <td><input type="text" name="entitys" class="form-control-sm" style="width:90%;"></td>
							</tr>
							<tr>
								<td style="width:20%;"><span>标签:</span></td>
							    <td><input type="text" name="tags" style="min-width:90%;"></td>
							</tr>
						</tbody>
					</table>
				</form>
			</div>
			<div class="modal-footer py-2">
				<button type="button" id="tagAddModal_saveTags" class="btn btn-sm btn-primary">保存</button>
				<button type="button" class="btn btn-sm btn-outline-primary" data-dismiss="modal">关闭</button>
			</div>
		</div>
	</div>
</div>
<div class="modal fade in" id="dimensionImportModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-md">
		<div class="modal-content">
			<div class="modal-header" style="height:35px;padding: 10px;font-weight:bold">
				<i class="fal fa-paw fa-fw"></i>Import
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> &times; </button>
			</div>
			<div class="modal-body px-3 py-0">
				<form id="dimensionImportForm" action="dmsn/dmsnSaveImport" method="POST" enctype="multipart/form-data">
					<table class="table table-striped table-bordered table-hover table-condensed wws-table">
						<tbody>
						    <tr><td><a href="dmsn/dmsnDownloadTmpl">下载导入模板</a></td></tr>
							<tr><td>
								<input type="file" name="uFile" class="form-control"></input>
							</td></tr>
						</tbody>
					</table>
				</form>
			</div>
			<div class="modal-footer py-2">
				<button type="button" class="btn btn-primary" data-dismiss="modal">关闭</button>
				<button type="button" id="btn_dmsn_save_import" class="btn btn-primary">导入</button>
			</div>
		</div>
	</div>
</div>
