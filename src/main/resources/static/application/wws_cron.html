<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 py-2">
			<form class="form-inline" id="cj_query_form" onsubmit="return false;">
				<div class="form-group mr-1 my-1">
					<label >产品：</label>
					<select class="form-control-sm" name="product" ></select>
				</div>
				<div class="form-group mr-1 my-1">
					<label >节点：</label>

				</div>

						<i class="fal fa-registered fa-fw"></i>重置

			</form>
		</div>
	</div>
</div>


<div id="cj_tab_toolbar" class="btn-group">
	<button class="btn btn-primary btn-sm" type="button" id="btn_add_cron">
        <i class="fal fa-plus fa-fw"></i>新增
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_edit_cron">

    </button>

    </button>

        <i class="fal fa-play fa-fw"></i>开始
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_stop_cron">

    </button>
    <button class="btn btn-primary btn-sm" type="button"  id="btn_log_cron">

    <button class="btn btn-primary btn-sm"  type="button" id="btn_manage_cron">
        <i class="fal fa-spinner fa-fw"></i>运行时数据
    </button>

<div class="panel mb-2">

									<span>节点：</span>
								</td>
								<td style="text-align:left;">
									<select class="form-control-sm" name="agent" style="width:90%"></select>
								</td>
							</tr>
							<tr>
								<td>
									<span>任务编号：</span>
								</td>
								<td style="text-align:left;">
									<input type="text" class="form-control-sm" name="jobId" style="width:90%">
								</td>
								<td>
									<span>任务名称：</span>
								</td>
								<td style="text-align:left;">

								<td>
									<span>执行表达式：</span>
								</td>
								<td style="text-align:left;">

								<td>

								</td>
								<td style="text-align:left;">

							<tr>

									<span>程序名称：</span>
								</td>

									</select>
								</td>
								<td>
									<span>模式：</span>
								</td>
								<td style="text-align:left;">
									<select id="model" class="form-control-sm" name="model" style="width:90%">
										<option  value="" selected="selected">请选择</option>

							<tr>

								</td>

						</tbody>
					</table>
				</form>
			</div>
		</div>
	</div>
</div>
<div class="modal fade in" id="cronLogsInfoWindowModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header py-2" >
				计划任务(<label id="cronLogJobId"></label>)日志
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> &times; </button>
			</div>
			<div class="modal-body px-3 pt-0 pb-2">
				<div class="panel mb-2" id="wrap_container_from">
					<div class="panel-container">
						<div class="panel-content px-3 py-2">
								<div class="row">
									<div class="col">
										<form class="form-inline">
											<div class="form-group input-group-sm mr-1">
												<label >时间：</label>
												<input type="date" name="qStartTime" class="form-control-sm mr-1" placeholder="请输入任务项实例编号">
												-
												<input type="date" name="qEndTime" class="form-control-sm ml-1" placeholder="请输入任务项编号">
											</div>
										</form>
									</div>
								</div>
								<div class="row mt-1">
									<div class="col form-inline">
										<div class="form-group input-group-sm mr-1">
											<label >产品：</label>
											<input type="text" class="form-control-sm" name="cronLogProduct"/>
										</div>
										<div class="form-group input-group-sm mr-1">
											<label >节点：</label>
											<input type="text" class="form-control-sm" name="cronLogAgent"/>
										</div>
										<div class="form-group input-group-sm mr-1">
											<label>运行结果：</label>
											<select class="form-control-sm" name="cronLogResult">
											    <option value="-1">全部</option>
											    <option value="1">成功</option>
												<option value="0">失败</option>
											</select>
										</div>
										<div class="form-group input-group-sm mr-1">
											<button type="button" id="btn_cronlog_query" class="btn btn-sm btn-primary mr-1">
												<i class="fal fa-binoculars fa-fw" aria-hidden="true"></i>查询
											</button>
											<button type="button" id="btn_cronlog_clear" class="btn btn-sm btn-primary">
												<i class="fal fa-registered fa-fw" aria-hidden="true"></i>重置
											</button>
										</div>
									</div>
								</div>
						</div>
					</div>
				</div>
				<table id ="tb_cron_logs" class="table table-sm table-striped table-hover table-condensed"></table>
			</div>
		</div>
	</div>
</div>
