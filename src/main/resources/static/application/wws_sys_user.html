<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> 
<ol class="breadcrumb page-breadcrumb">
    <li class="breadcrumb-item"><a href="javascript:void(0);">分布式调度</a></li>
    <li class="breadcrumb-item">系统管理</li>
    <li class="breadcrumb-item active">用户管理</li>
    <li class="position-absolute pos-top pos-right d-none d-sm-block"><span class="js-get-date"></span></li>
</ol>
<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 py-2">
			<form class="form-inline">
				<div class="form-group mr-1 my-1">
					<label >登录名：</label>
					<input type="text" name="qLoginName" class="form-control-sm" placeholder="请输入登录名">
				</div>
				<div class="form-group mr-1 my-1">
					<label >姓名：</label>
					<input type="text" name="qUserName" class="form-control-sm" placeholder="请输入姓名">
				</div>
				<div class="form-group mr-1 my-1">
					<label >是否锁定：</label>
					<select id="qLockFlag" class="form-control-sm" >
						<option value=''>请选择是否锁定</option>
						<option value='0'>已锁定</option>
						<option value='1'>未锁定</option>
					</select>
				</div>
				<div class="form-group mr-1 my-1">
					<button type="button" id="btn_sysuser_query" class="btn btn-sm btn-primary mr-1">
						<i class="fal fa-binoculars fa-fw"></i>查询
					</button>
					<button type="button" id="btn_sysuser_clear" class="btn btn-sm btn-primary">
						<i class="fal fa-registered fa-fw"></i>重置
					</button>
				</div>
			</form>
		</div>
	</div>
</div>

<div id="sysuser_tab_toolbar" class="btn-group">
	<button class="btn btn-primary btn-sm" type="button" id="btn_sysuser_add">
        <i class="fal fa-plus fa-fw"></i>新增
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_sysuser_edit">
        <i class="fal fa-edit fa-fw"></i>修改
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_sysuser_del">
        <i class="fal fa-minus fa-fw"></i>删除
    </button>
</div>

<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 pt-0 pb-2">
			<table data-toggle="table" class="table table-sm table-striped" id="tb_sysUser"></table>
		</div>
	</div>
</div>

<div class="modal fade in" id="sysUserEditModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-lg" style="min-width:680px">
		<div class="modal-content">
			<div class="modal-header py-2 border border-top-0 border-left-0 border-right-0" style="font-weight:bold">
				<span id="addOrEdit">用户编辑 </span>
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> &times; </button>
			</div>
			<div class="modal-body py-3">
				<form role="form" >
					<div class="form-group mb-1">
						<label for="loginName" class="control-label">登录名：</label>
						<div class="col-12">
							<input type="text" class="form-control-sm w-100" name="loginName">
						</div>
					</div>
					<div class="form-group mb-1">
						<label for="userName" class="control-label">姓名：</label>
						<div class="col-12">
							<input type="text" class="form-control-sm w-100" name="userName">
						</div>
					</div>
					<div class="form-group mb-1">
						<label for="userMobile" class="control-label">手机：</label>
						<div class="col-12">
							<input type="text" class="form-control-sm w-100" name="userMobile">
						</div>
					</div>
					<div class="form-group mb-1">
						<label for="userEmail" class="control-label">邮箱：</label>
						<div class="col-12">
							<input type="text" class="form-control-sm w-100" name="userEmail">
						</div>
					</div>
					<div class="form-group mb-1">
						<label for="validDate" class="control-label">有效期限：</label>
						<div class="col-12">
							<input type="date" class="form-control-sm w-35" name="validDate">
							-
							<input type="date" class="form-control-sm w-35" name="invalidDate">
						</div>
					</div>
					<div class="form-group mb-1">
						<label for="validDate" class="control-label">角色：</label>
						<div class="col-12 mt-1" id="sysUserRoleRef"></div>
					</div>
					<div class="form-group mb-1">
						<label for="validDate" class="control-label">产品：</label>
						<div class="col-12 mt-1" id="sysUserProductRef"></div>
					</div>
				</form>
			</div>
			<div class="modal-footer border border-bottom-0 border-left-0 border-right-0 py-1">
				<button type="button" id="saveSysUser" class="btn btn-sm btn-primary">
					<i class="fal fa-save fa-fw"></i>保存
				</button>
				<button class="btn btn-sm btn-outline-primary" data-dismiss="modal" >关闭</button>
			</div>
		</div>
	</div>
</div>
