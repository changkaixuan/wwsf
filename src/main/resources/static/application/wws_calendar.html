<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> 
<ol class="breadcrumb page-breadcrumb">
    <li class="breadcrumb-item"><a href="javascript:void(0);">分布式调度</a></li>
    <li class="breadcrumb-item">任务管理</li>
    <li class="breadcrumb-item active">假日编排</li>
    <li class="position-absolute pos-top pos-right d-none d-sm-block"><span class="js-get-date"></span></li>
</ol>
<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 py-2">
			<form class="form-inline" id="calendarSearchForm" onsubmit="return false;">
				<div class="form-group mr-1 my-1">
					<label >产品：</label>
					<select id="calendar_products" class="form-control-sm" name="qProduct" ></select>
				</div>
				<div class="form-group mr-1 my-1">
					<label >名称：</label>
					<input type="text" name="qCalName" class="form-control-sm" placeholder="请输入名称">
				</div>
				<div class="form-group mr-1 my-1">
					<button type="button" id="tb_calendar_search" class="btn btn-sm btn-primary mr-1">
						<i class="fal fa-binoculars fa-fw"></i>查询
					</button>
					<button type="button" id="tb_calendar_clear" class="btn btn-sm btn-primary">
						<i class="fal fa-registered fa-fw"></i>重置
					</button>
				</div>
			</form>
		</div>
	</div>
</div>

<div id="tab_calendar_toolbar" class="btn-group">
	<button class="btn btn-primary btn-sm" type="button" id="btn_add_calendar">
        <i class="fal fa-plus fa-fw"></i>新增
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_edit_calendar">
        <i class="fal fa-edit fa-fw"></i>修改
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_delete_calendar">
        <i class="fal fa-minus fa-fw"></i>删除
    </button>
</div>

<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 pt-0 pb-2 table-responsive">
			<table data-toggle="table" class="table table-sm table-striped" id="calendar_tab" style="word-break:break-all;word-wrap:break-all;"></table>
		</div>
	</div>
</div>

<div class="modal fade in" id="modal_calendar_edit" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content" style="width:550px;">
			<div class="modal-header py-2 border border-top-0 border-left-0 border-right-0">
                <h6 class="modal-title h6">假日编排</h6>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                     &times; 
                </button>
            </div>
			<div class="modal-body px-3 pt-1 pb-2">
				<div class="container-fluid">
					<div class="row">
						<div class="col-9 p-0">
							<ul class="nav nav-tabs">
								<li class="nav-item">
									<a href="#tab_calendar_info" data-toggle="tab" class="nav-link active mt-2 px-4" >基本信息</a>
								</li>
								<li class="nav-item">
									<a href="#tab_calendar_include" data-toggle="tab" class="nav-link mt-2 px-4" >包含</a>
								</li>
								<li class="nav-item">
									<a href="#tab_calendar_exclusion" data-toggle="tab" class="nav-link mt-2 px-4" >排除</a>
								</li>
							</ul>
						</div>
						<div class="col-3 border-bottom p-0 clearfix" >
							<button type="button" id="save_cal_plan" class="btn btn-sm btn-outline-primary float-right py-1 mt-1" aria-hidden="true">
								<i class="fal fa-save fa-fw"></i>保存
							</button>
						</div>
					</div>
				</div>
				<div class="tab-content border border-top-0 p-1">
				    <div class="tab-pane active" id="tab_calendar_info">
						<table class="table table-sm table-bordered table-condensed table-form">
							<tr>
								<td width="100px" style="text-align:right;"><span>产品：</span></td>
								<td><select class="form-control-sm w-100" name="product" ></select></td>
							</tr>
							<tr>
								<td style="text-align:right;"><span>名称：</span></td>
								<td><input type="text" name="calName" class="form-control-sm w-100" placeholder="请输入名称"></td>
							</tr>
							<tr>
								<td style="text-align:right;"><span>描述：</span></td>
                       			<td><textarea name="calDescription" class="form-control w-100" rows="3"></textarea></td>
							</tr>
						</table>
					</div>
					<div class="tab-pane" id="tab_calendar_include">
						<table id="tab_calendar_include_edit_table" class="table table-sm"></table>
					</div>
					<div class="tab-pane" id="tab_calendar_exclusion">
						<table id="tab_calendar_exclusion_edit_table" class="table table-sm"></table>
					</div>
				</div>
			</div>
		</div>					
	</div>
</div>
