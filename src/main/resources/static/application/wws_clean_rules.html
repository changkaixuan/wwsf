<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<ol class="breadcrumb page-breadcrumb">
	<li class="breadcrumb-item"><a href="javascript:void(0);">分布式调度</a></li>
	<li class="breadcrumb-item">参数设置</li>
	<li class="breadcrumb-item active">预警参数 清理参数</li>
	<li class="position-absolute pos-top pos-right d-none d-sm-block"><span class="js-get-date"></span></li>
</ol>

<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 pt-0">
			<ul class="nav nav-tabs">
				<li class="nav-item">
					<a href="#wws_ewarn" data-toggle="tab" class="nav-link active mt-2 px-4" >预警</a>
				</li>
				<li class="nav-item">
					<a href="#wws_clean" data-toggle="tab" class="nav-link mt-2 px-4" >清理</a>
				</li>
			</ul>
			<div class="tab-content border border-top-0 p-2">
				<!------------------------------------- 预警选项卡 ------------------------------------->
				<div class="tab-pane active" id="wws_ewarn">
					<div class="px-3 py-2">
						<div class="ml-4 pt-1" style="width:80px; height:30px; background-color:white;position:absolute;"><h5 style="float:left;" class="mt-1">&nbsp;&nbsp;<b>预警参数</b></h5></div>
						<form class="form-inline">
						   <ul class="mt-3 py-4 pr-5" style="border:1px #d0d0d0 solid; width:40%; min-width:340px;">
						      <li>
						      		<input type="checkbox" class="form-control" name="cbk_ewarn_task_running_timeout"/>
						            &nbsp;&nbsp; 任务执行超过&nbsp;<input type="number" min=0 name="ewarn_task_running_timeout" style="width:80px;">&nbsp;秒
						      </li>
						      <li>
						      		<input type="checkbox" class="form-control" name="cbk_ewarn_task_manual"/>
						            &nbsp;&nbsp; 需人工干预
						      </li>
						      <li>
						      		<input type="checkbox" class="form-control" name="cbk_ewarn_node_breakdown"/>
						            &nbsp;&nbsp; 节点故障
						      </li>
						      <li>
						      		<input type="checkbox" class="form-control" name="cbk_ewarn_task_fail"/>
						            &nbsp;&nbsp; 任务失败 
						      </li>
						      <li>
						      		<input type="checkbox" class="form-control" name="cbk_ewarn_task_fail_retry_too_many"/>
						            &nbsp;&nbsp; 任务失败重试&nbsp;<input type="number" min=0 name="ewarn_task_fail_retry_too_many" style="width:80px;">&nbsp;次
						      </li>
						    </ul>
						</form>
						<p>
						      <button class="btn btn-primary btn-sm" type="button" id="save_ewarn_setting">
						   		    <i class="fal fa-plus fa-fw"></i>保存
						      </button>
					    </p>
					</div>
				</div>
				<!------------------------------------- 清理选项卡 ------------------------------------->
				<div class="tab-pane" id="wws_clean">
					<div class="panel mb-2">
						<div class="panel-container">
							<div class="panel-content px-3 py-2">
								<form class="form-inline">
									<div class="form-group input-group-sm mr-1 my-1">
								   		<label>产品：</label>
								   		<select class="select2" name="cond_product" id="qProduct"></select>
									</div>
								</form>
							</div>
						</div>
					</div>
					<div class="panel mb-2">
						<div class="panel-container">
							<div class="panel-content px-3 py-2">
								<form class="form-inline">
									<input type="checkbox" class="form-control-sm mr-1" name="cbk_clean_job_exe_info_tvalue"/>
									清理JOB执行历史，保留&nbsp;<input type="number" min=0 name="clean_job_exe_info_tvalue" style="width:80px;">&nbsp;条记录
									<button class="btn btn-primary btn-xs ml-2" type="button" id="save_clean_setting">保存</button>
									<button type="button" class="btn btn-xs btn-primary ml-1" id="clean_rules_execute">执行策略</button>
								</form>
							</div>
						</div>
					</div>
					<div class="wrap_container clearfix">
		   				<div class="panel mb-2">
				        	<div class="panel-hdr" style="min-height:2rem">
				                <span class="mr-2">Job实例清理策略</span>
				                <button class="btn btn-primary btn-xs" type="button" id="btn_add_job_rule">
							        <i class="fal fa-plus fa-fw"></i>新增
							    </button>
				            </div>
				            <div class="panel-container show">
				                <div class="panel-content">
				                	<table id="job_ins_clean_rule_table" class="table table-sm table-striped"></table>
				                </div>
				            </div>
				        </div>
		   				<div class="panel mb-2">
				        	<div class="panel-hdr" style="min-height:2rem">
				                <span class="mr-2">Cron日志清理策略</span>
				                <button class="btn btn-primary btn-xs" type="button" id="btn_add_cron_rule">
							        <i class="fal fa-plus fa-fw"></i>新增
							    </button>
				            </div>
				            <div class="panel-container show">
				                <div class="panel-content">
				                	<table id="cron_log_clean_rule_table" class="table table-sm table-striped"></table>
				                </div>
				            </div>
				        </div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="modal fade in" id="edit_celan_rule_modal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<div class="modal-header py-2 border border-top-0 border-left-0 border-right-0 mb-1">
				编辑清理策略
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> &times; </button>
			</div>
			<div class="modal-body px-3 py-0">
				<form class="form-inline">
					<table class="table table-sm table-bordered table-condensed table-form">
						<tr>
							<td align="right" width="18%"><span>策略编号：</span></td>
							<td align="left">
								<input type="hidden" name="type" />
								<input type="text" class="form-control-sm" name="id" style="width:50%"/>
							</td>
						</tr>
						<tr>
							<td align="right"><span>产品：</span></td>
							<td align="left">
								<select class="form-control-sm" name="product" style="width:50%"></select>
							</td>
						</tr>
						<tr>
							<td align="right"><span>任务名称：</span></td>
							<td>
								<div class="row">
									<div class="col-lg-12 col-md-12 col-sm-12 mt-1" id="jobIds"></div>
								</div>
							</td>
						</tr>
						<tr>
							<td align="right"><span>保留时间：</span></td>
							<td>
								<input type="number" min=0 max=31 name="keepTimeDay" class="form-control-sm" style="width:15%;">&nbsp;天
								<input type="number" min=0 max=12 name="keepTimeMonth" class="form-control-sm" style="width:15%;">&nbsp;月
								<input type="number" min=0 max=5 name="keepTimeYear" class="form-control-sm" style="width:15%;">&nbsp;年
							</td>
						</tr>
						<tr id="tr_clean_running_job">
							<td align="right"><span>是否清理正在执行：</span></td>
                      		<td><input type="checkbox" class="icheckbox form-control-sm" name="clearRunningJob"></td>
						</tr>
					</table>
				</form>
			</div>
			<div class="modal-footer py-2 border border-bottom-0 border-left-0 border-right-0 mt-1">
				<button type="button" class="btn btn-sm btn-outline-primary" data-dismiss="modal">关闭</button>
				<button  type="button" id="btn_save_clean_rule" class="btn btn-sm btn-primary">保存</button>
			</div>
		</div>
	</div>
</div>
