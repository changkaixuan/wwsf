<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<div class="modal fade in" id="updatePasswordModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body px-5 py-4 bg-faded rounded-plus">
				<div class="form-group mb-2">
					<label class="form-label h6 fw-600">旧密码</label>
					<input type="text" class="form-control form-control-lg" name='oldPwd'>
				</div>
				<div class="form-group mb-3">
					<label class="form-label h6 fw-600">新密码</label>
					<input type="password" class="form-control form-control-lg" name='newPwd' >
				</div>
				<div class="form-group mb-3">
					<label class="form-label h6 fw-600">确认密码</label>
					<input type="password" class="form-control form-control-lg" name='affirmNewPwd'>
				</div>
				<div class="row no-gutters">
					<div class="col-6 pr-1 my-2">
						<button type="button" class="btn btn-lg btn-danger btn-block" id="btn_updatepassword_save">
							<i class="fal fa-save fa-fw mr-2"></i>保存
						</button>
					</div>
					<div class="col-6 pl-1 my-2">
						<button type="button" class="btn btn-lg btn-info btn-block" id="btn_updatepassword_reset">
							<i class="fal fa-reply fa-fw mr-2"></i>重置
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
