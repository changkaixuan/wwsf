<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<div class="modal fade in" id="sysLoginModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-body px-5 py-4 bg-faded rounded-plus">
				<div class="form-group mb-2">
					<label class="form-label h6 fw-600">用户名</label>
					<input type="text" class="form-control form-control-lg" name='userName'>
				</div>
				<div class="form-group mb-3">
					<label class="form-label h6 fw-600">密码</label>
					<input type="password" class="form-control form-control-lg" name='password'>
				</div>
				<div class="row no-gutters">
					<div class="col-6 pr-1 my-2">
						<button type="button" class="btn btn-lg btn-danger btn-block" id="btn_syslogin_login">
							<i class="fal fa-user fa-fw mr-2"></i>登录
						</button>
					</div>
					<div class="col-6 pl-1 my-2">
						<button type="button" class="btn btn-lg btn-info btn-block" id="btn_syslogin_reset">
							<i class="fal fa-reply fa-fw mr-2"></i>重置
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
