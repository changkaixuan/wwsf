<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> 
<style>
input.noborder{
	border:0;
	background-color:#fff;
	width: 58%;
}
#zkNodeNow{
	width:90%;
}
#zkNodeShow > div{
	padding: 2px 0;
	cursor:pointer;
}
#zkNodeShow > div:hover { 
	border-bottom: 1px solid #337ab7;
}
#zkNodeShow > div > a[data-event='zoo_node_detail_link']:hover { 
	cursor:move;
}

.form-group-separated .form-group [class^="col-md-"]{
	padding: 3px 10px;
}
.file-name-clipping {
	overflow : hidden;
	text-overflow : ellipsis;
	display : -webkit-box;
	-webkit-line-clamp : 2;
	-webkit-box-orient : vertical
}
</style>
<script type="text/javascript" src="js/jquery.pagination.js"></script>
<ol class="breadcrumb page-breadcrumb">
    <li class="breadcrumb-item"><a href="javascript:void(0);">分布式调度</a></li>
    <li class="breadcrumb-item">数据源</li>
    <li class="breadcrumb-item active">我的文档</li>
    <li class="position-absolute pos-top pos-right d-none d-sm-block"><span class="js-get-date"></span></li>
</ol>
<div class="input-group my-2" id="prod_menu">
	<div class="input-group-prepend dropdown">
		<button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-toggle="dropdown">
			产品
		</button>
		<div class="dropdown-menu"></div>
	</div>
	<input type="text" class="form-control" style="font-weight:bold;background:none;border-color:#886ab5;" readonly="readonly" value="/">
</div>     
<div class="row">
	<div class="col-6 col-lg-4 col-xl-3">
		<div class="panel mb-0"  >
			<div class="panel-container">
				<div class="panel-hdr"><h2>文件目录</h2></div>
				<div class="panel-content">
					<div id="dirTree"></div>
				</div>
			</div>
		</div>
	</div>  
	<div class="col-6 col-lg-8 col-xl-9">
		<div class="panel mb-0"> 
            <div class="panel-container container-fluid">
           		<div class="panel-hdr" >
           			<h2>文件列表</h2>
           			<div class="panel-toolbar">
           				<button class="btn btn-primary btn-sm mr-1" type="button" id="btn_to_create_folder_modal" title="新建文件夹">
				   		    <i class="fal fa-folder"></i>
				      	</button>
				      	<button class="btn btn-primary btn-sm mr-1" type="button" id="btn_to_upload_file_modal" title="上传文件到当前文件夹">
				   		    <i class="fal fa-upload"></i>
				      	</button>
           				<div class="dropdown dropleft">
							<button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-toggle="dropdown" title="更多选项">
								<i class="fal fa-list"></i>
							</button>
							<div class="dropdown-menu">
								<a class="dropdown-item" href="#" id="btn_show_file_imgs">大图标</a>
								<a class="dropdown-item" href="#" id="btn_show_file_list">详细信息列表</a>
							</div>
						</div> 
			       </div>
           		</div>
            	<div id="folder_main_container" class="panel-content d-flex flex-wrap">
            	</div>
            </div>
		</div>
	</div>
</div>
<div class="modal fade in" id="createFolderModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-header py-2 border border-top-0 border-left-0 border-right-0" style="font-weight:bold">
				文件夹名称
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> &times; </button>
			</div>
			<div class="modal-body">
				<form role="form">
				    <div class="form-group mb-2">
						<input type="text" class="form-control" name="folderName" >
					</div>
					<button type="button" id="btn_new_folder_save" class="btn btn-sm btn-primary">创建</button>
				</form>
			</div>
		</div>
	</div>
</div>
<div class="modal fade in" id="uploadFilesModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-sm">
		<div class="modal-content">
			<div class="modal-header py-2 border border-top-0 border-left-0 border-right-0" style="font-weight:bold">
				上传文件
				<button type="button" class="close" data-dismiss="modal" aria-hidden="true"> &times; </button>
			</div>
			<div class="modal-body">
				<form role="form">
				    <div class="form-group mb-2">
				    	<button type="button" class="btn btn-sm btn-primary btn-block" data-dismiss="modal" >选择需要上传的文件</button>
					</div>
					<button type="button" class="btn btn-sm btn-primary" data-dismiss="modal" >取消</button>
					<button type="button" id="btn_upload_files" class="btn btn-sm btn-primary">上传</button>
				</form>
			</div>
		</div>
	</div>
</div>
