<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> 
<ol class="breadcrumb page-breadcrumb">
    <li class="breadcrumb-item"><a href="javascript:void(0);">分布式调度</a></li>
    <li class="breadcrumb-item">数据源</li>
    <li class="breadcrumb-item active">Jdbc DataSource</li>
    <li class="position-absolute pos-top pos-right d-none d-sm-block"><span class="js-get-date"></span></li>
</ol>
<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 py-2">
			<form class="form-inline" onsubmit="return false;">
				<div class="form-group mr-1 my-1">
					<label >产品：</label>
					<select id="query_product" class="form-control-sm" name="q_product" ></select>
				</div>
				<div class="form-group mr-1 my-1">
					<label >数据源名称：</label>
					<input type="text" name="q_name" class="form-control-sm" placeholder="请输入数据源名称">
				</div>
				<div class="form-group mr-1 my-1">
					<button type="button" id="btn_datasource_query" class="btn btn-sm btn-primary mr-1">
						<i class="fal fa-binoculars fa-fw"></i>查询
					</button>
					<button type="button" id="btn_datasource_clear" class="btn btn-sm btn-primary">
						<i class="fal fa-registered fa-fw"></i>重置
					</button>
				</div>
			</form>
		</div>
	</div>
</div>

<div id="ds_tab_toolbar" class="btn-group">
	<button class="btn btn-primary btn-sm" type="button" id="btn_datasource_add">
        <i class="fal fa-plus fa-fw"></i>新增
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_datasource_edit">
        <i class="fal fa-edit fa-fw"></i>修改
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_datasource_del">
        <i class="fal fa-minus fa-fw"></i>删除
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_datasource_create">
        <i class="fal fa-play fa-fw"></i>创建
    </button>
    <button class="btn btn-primary btn-sm" type="button" id="btn_datasource_destroy">
        <i class="fal fa-pause fa-fw"></i>销毁
    </button>
</div>

<div class="panel mb-2">
	<div class="panel-container">
		<div class="panel-content px-3 pt-0 pb-2">
			<table data-toggle="table" class="table table-sm table-striped" style="word-break:break-all; word-warp:break-word;" id="tb_datasource"></table>
		</div>
	</div>
</div>
	
<div class="modal fade in" id="dataSourceEditModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog modal-lg" style="min-width:580px">
		<div class="modal-content">
			<div class="modal-header py-2">
                <h6 class="modal-title h6">数据源信息编辑窗口</h6>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                     &times; 
                </button>
            </div>
			<div class="modal-body px-3 pt-0 pb-2">
				<form>
					<table class="table table-sm table-striped table-bordered table-condensed table-form">
						<tbody>
							<tr>
								<td nowrap colspan="4">
									<button  type="button" id="dsem_btn_save" class="btn btn-primary btn-sm">保存</button>
								</td>
							</tr>
							<tr>
								<td width="100px"><span>产品：</span></td>
								<td style="text-align:left;">
									<select class="form-control-sm" name="product" style="width:80%"></select>
								</td>
								<td><span>数据源名称：</span></td>
								<td style="text-align:left;">
									<input type="text" class="form-control-sm" name="name" style="width:80%">
								</td>
							</tr>
							<tr>
								<td><span>节点：</span></td>
								<td style="text-align:left;" colspan="3">
									<select class="form-control-sm" name="agent" style="width:80%"></select>
								</td>
							</tr>
							<tr>
								<td><span>驱动：</span></td>
								<td style="text-align:left;" colspan="3">
									<select class="form-control-sm" id="sel_driverName" name="driverName"  style="width:80%;"></select>
								</td>
							</tr>
							<tr>
								<td><span>数据源类型：</span></td>
								<td style="text-align:left;">
									<select class="form-control-sm" name="databaseType" style="width:80%">
										<option value="DataSource" selected>DataSource</option>
										<option value="ConnectionPoolDataSource" selected>ConnectionPoolDataSource</option>
									</select>
								</td>
								<td><span>自动启动：</span></td>
								<td style="text-align:left;">
									<input type="checkbox" class="form-control-sm" name="autoStart">
								</td>
							</tr>
							<tr>
								<td><span>URL：</span></td>
								<td style="text-align:left;" colspan="3">
									<input type="text" class="form-control-sm" name="jdbcUrl" style="width:80%;">
								</td>
							</tr>
							<tr>
								<td><span>用户名：</span></td>
								<td style="text-align:left;" colspan="3">
									<input type="text" class="form-control-sm" name="jdbcUser">
								</td>
							</tr>
							<tr>
								<td><span>密码：</span></td>
								<td style="text-align:left" colspan="3">
									<input type="text" class="form-control-sm" name="jdbcPassword" style="width:80%;">
								</td>
							</tr>
							<tr>
								<td><span>连接池类型：</span></td>
								<td style="text-align:left;">
									<select class="form-control-sm" name="pool" style="width:80%">
										<option value="dbcp2" selected>dbcp2</option>
										<option value="c3p0">c3p0</option>
									</select>
								</td>
								<td><span>XA：</span></td>
								<td style="text-align:left;">
									<input type="checkbox" class="form-control-sm" name="xa">
								</td>
							</tr>
							<tr>
								<td><span>连接池属性：</span></td>
								<td style="text-align:left" colspan="3">
									<table data-toggle="table" class="table table-sm table-striped" id="etab_ds_pool_properties" style="table-layout:fixed;width:100%;scroll:no;word-break:break-all;"></table>
								</td>
							</tr>
						</tbody>
					</table>
				</form>
			</div>
		</div>
	</div>
</div>
