	                <span class="badge badge-primary fw-800 ml-auto">Topological Graph</span>
	            </div>
	        </div>
	        <div class="panel-container show">
	            <div class="panel-content pt-1">

	            			<label class="font-weight-bold font-italic ml-3">展示：</label>
	            			<button type="button" id="btn_vis_topo_refresh" class="btn btn-xs btn-outline-primary ml-2"><i class="fal fa-sync-alt"></i></button>

	            			<button type="button" id="btn_vis_topo_left_right" class="btn btn-xs btn-outline-primary ml-1"><i class="fal fa-long-arrow-alt-right"></i></button>
