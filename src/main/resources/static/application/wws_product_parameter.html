<!--<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">-->
<div data-bind="attr:{'id':elid+'_tb_product_param_template_toolbar'}" class="form-inline">
    <div class="btn-group">
        <button data-bind="attr:{'id':elid+'_btn_product_param_add'}" type="button" class="btn btn-primary btn-sm">
        	<i class="fal fa-plus fa-fw"></i>新增
        </button>
        <button data-bind="attr:{'id':elid+'_btn_product_param_edit'}" type="button" class="btn btn-primary btn-sm">
        	<i class="fal fa-edit fa-fw"></i>修改
        </button>
        <button data-bind="attr:{'id':elid+'_btn_product_param_delete'}" type="button" class="btn btn-primary btn-sm">
        	<i class="fal fa-minus fa-fw"></i>删除
        </button>
    </div>
    <div class="form-group ml-2">
        <input type="text" name="product_param_authId" class="form-control-sm mr-1" data-bind="attr:{'id':elid+'_input_authid_query'}" placeholder="认证信息编号">
        <button type="button" data-bind="attr:{'id':elid+'_btn_product_param_query'}" class="btn btn-sm btn-primary mr-1">查询</button>
        <button type="button" data-bind="attr:{'id':elid+'_btn_product_param_clear'}" class="btn btn-sm btn-primary">重置</button>
    </div>
</div>

<div class="panel mb-2">
    <div class="panel-container">
        <div class="panel-content px-3 pt-0 pb-2">
            <table data-id="tb_product_param_table" 
            data-bind="attr:{'id':elid+'_tb_product_param_table'}" class="table table-sm table-striped"
            style="word-break:break-all;word-wrap:break-all"></table>
        </div>
    </div>
</div>
